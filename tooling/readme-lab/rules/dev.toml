[[rule]]
id = "list-dominant-doc"
name = "List-dominant document"
category = "lists"
weight = 3
kind = "list_dominant"
min_prose_words = 200
ratio_above = 1.5
score = "once"
example_bad = '''
# foo

foo turns an event journal into per-tenant ledgers.
It ships as one binary with no runtime dependencies.

- Reads events from the journal directory
- Writes one ledger file per tenant
- Checks the schema version before reading
- Stops when the version is too new
- Prints the offending version and path
- Uses environment variables for all configuration
- Requires TENANT_ID for every single run
- Requires JOURNAL_DIR to point at events
- Requires LEDGER_DIR for the output files
- Refuses to start with missing variables
- Never writes a partial ledger file
- Replays events in their original order
- Keeps projections free of side effects
- Verifies each ledger after writing it
- Compares checksums against the journal index
- Exits with code 2 on mismatch
- Logs every decision to standard error
- Supports JSON output for log shipping
- Runs on Linux and macOS hosts
- Builds with the stable Rust toolchain

Compaction and retention are separate commands.
Both need an explicit operator decision first.

- Compaction copies live events into segments
- Compaction replays the copy before swapping
- Compaction keeps the old segment on mismatch
- Compaction prints the first differing event
- Retention keeps events inside the window
- Retention needs an explicit cutoff date
- Prune refuses unverified tenant ledgers
- Prune removes segments older than cutoff
- Prune writes a summary of removed events
- Snapshots copy the whole journal directory
- Snapshots use clonefile where it exists
- Restores replace the journal from snapshots
- Restores verify every ledger afterwards
- Upgrades replace the binary in place
- Upgrades keep the journal format unchanged
- Downgrades are refused by the version check
- Metrics expose event counts per tenant
- Metrics expose replay duration per ledger
- Health checks read the last journal offset
- Alerts fire when replay falls behind

Licensed under MIT.
Issues go to the tracker.
'''
example_good = '''
# foo

foo turns an event journal into per-tenant ledgers. The reasoning for each
choice lives in the paragraphs, and lists only hold things a reader copies.

- `foo build`
- `foo check`

Build reads TENANT_ID, JOURNAL_DIR and LEDGER_DIR from the environment. Check
exits 1 on schema drift, so run it in CI before a deploy.
'''

