[package]
name = "readme-lab"
description = "README evaluator: formatting-slop objective plus accuracy gates over autoresearch JSONL protocol v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# Standalone: deliberately not a member of the repository workspace.
[workspace]

[[bin]]
name = "readme-lab"
path = "src/main.rs"

[dependencies]
autoresearch-cli = { path = "../../apps/autoresearch-cli" }
autoresearch-config = { path = "../../crates/autoresearch-config" }
autoresearch-core = { path = "../../crates/autoresearch-core" }
autoresearch-evaluator = { path = "../../crates/autoresearch-evaluator" }
clap = { version = "4.5.51", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
