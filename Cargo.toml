[workspace]
members = [
    "apps/autoresearch-cli",
    "crates/autoresearch-config",
    "crates/autoresearch-core",
    "crates/autoresearch-evaluator",
    "crates/autoresearch-git",
    "crates/autoresearch-market",
    "crates/autoresearch-product-web",
    "crates/autoresearch-report",
    "crates/autoresearch-runner",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Wolven Tech"]
license = "MIT"
repository = "https://github.com/wolven-tech/autoresearch-rs"

[workspace.dependencies]
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
toml = "0.9.8"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
