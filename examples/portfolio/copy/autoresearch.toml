schema_version = 1

[experiment]
name = "source-grounded copy loop"
[experiment.objective]
name = "factual_copy_issue_count"
direction = "minimize"
[experiment.budget]
max_candidates = 2
max_failures = 1
wall_clock_seconds = 120

[scope]
mutable_paths = ["apps/web/content", "apps/web/src/pages"]
protected_paths = ["autoresearch.toml", "program.md", "docs/BET.md", "docs/claims.md"]

[agent]
program = "manual"
timeout_seconds = 30

[[evaluators]]
id = "copy_browser_v1"
hard_gates = ["browser_viewport_exact", "browser_no_overflow", "browser_controls_named", "browser_local_only", "browser_motion_setting", "browser_route_status"]
[evaluators.command]
program = "autoresearch-web-evaluator"
args = ["--route", "home", "--manifest", "autoresearch.toml"]
timeout_seconds = 45

[[evaluators]]
id = "copy_grounding_v1"
hard_gates = ["source_claims_verified", "cta_action_available"]
[evaluators.command]
program = "REPLACE_WITH_LOCAL_COPY_JSONL_EVALUATOR"
args = ["--adapter-version", "1"]
timeout_seconds = 45
[[evaluators.metrics]]
name = "factual_copy_issue_count"
kind = "objective"
direction = "minimize"

[web]
origin = "http://127.0.0.1:4402"
viewports = [320, 390, 768, 1280]
reduced_motion = true
[[web.routes]]
name = "home"
path = "/"
expected_status = 200
[web.thresholds]
max_lcp_ms = 2500
max_cls_milli = 100
min_accessibility_score = 90
