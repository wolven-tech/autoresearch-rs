name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Allow user namespaces for Chromium only
        run: |
          chromium_bin="$(readlink -f "$(command -v chromium)")"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile chromium-ci "%s" flags=(unconfined) {\n  userns,\n}\n' "$chromium_bin" | sudo tee /etc/apparmor.d/chromium-ci
          sudo apparmor_parser -r /etc/apparmor.d/chromium-ci
      - name: Chromium smoke
        timeout-minutes: 1
        run: chromium --headless=new --disable-gpu --no-first-run --dump-dom about:blank
      - name: Test
        run: cargo test --workspace --all-features --no-fail-fast
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
