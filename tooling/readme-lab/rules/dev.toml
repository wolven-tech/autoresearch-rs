[[rule]]
id = "callout-blockquote-spam"
name = "Callout spam"
category = "callouts"
weight = 3
kind = "regex"
lines = ["quote"]
text = "nocode"
pattern = '''(?i)^\s*>\s*(?:\[!(?:note|tip|important|warning|caution)\]|(?:\*\*|__)?(?:\p{Emoji_Presentation}|\p{Extended_Pictographic}\x{FE0F}|\x{2139}\x{FE0F}?)?\s*(?:\*\*|__)?(?:note|tip|pro[- ]?tip|important|warning|caution|heads[- ]?up|info|hint|remember)\b)'''
per_line = true
group_consecutive = true
combine = "any"
min_hits = 3
density_words = 300.0
density_above = 1.0
score = "density_excess"
example_bad = '''
> [!NOTE]
> The cache lives in `target/`.

Run the build.

> 💡 **Tip:** clone the build dir first.

Run the tests.

> [!IMPORTANT]
> Tests need a running Core.
'''
example_good = '''
> [!WARNING]
> This deletes the journal.

The binary reads events from the journal directory and writes one ledger file per tenant. Each run starts by checking the schema version recorded in the journal header, and it stops with exit code 2 when that version is newer than the binary understands. Operators usually run the check command in CI before a deploy, because a failed check there costs seconds while a failed migration in production costs an incident review.

Configuration lives in environment variables only. TENANT_ID selects the tenant, JOURNAL_DIR points at the journal, and LEDGER_DIR names the output directory. When any of the three is missing the binary prints the name of the missing variable and exits before it opens a single file, so a misconfigured host never produces a partial ledger that someone might later mistake for a complete one.

Upgrades replace the binary in place; the journal format has not changed since version 0.4.

Journal compaction runs only when the operator asks for it. The compact command copies every live event into a new segment, verifies the copy by replaying it into a scratch ledger, and swaps the segment in with a single rename. If the replay disagrees with the current ledger in any field, the command leaves the old segment untouched and prints the first event whose projection differs, with its offset and tenant, so the operator can open that event and decide whether the journal or the projection code is wrong.

Retention is a separate decision from compaction. Events older than the retention window stay in the journal until an operator runs the prune command with an explicit cutoff date, and prune refuses to run while any tenant has an unverified ledger. That ordering keeps the one irreversible step behind the one check that can catch a bad projection before the source events are gone for good.
'''

