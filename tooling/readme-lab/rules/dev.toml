min_total_lines = 60
example_bad = '''
## Usage

```rust
use foo::{Journal, Ledger, Tenant};
use std::path::PathBuf;

fn main() -> Result<(), foo::Error> {
    let journal_dir = PathBuf::from(std::env::var("JOURNAL_DIR")?);
    let ledger_dir = PathBuf::from(std::env::var("LEDGER_DIR")?);
    let tenant = Tenant::new(std::env::var("TENANT_ID")?);
    let journal = Journal::open(&journal_dir)?;
    journal.check_schema()?;
    let mut ledger = Ledger::create(&ledger_dir, &tenant)?;
    for event in journal.events_for(&tenant)? {
        let event = event?;
        match event.kind() {
            "deposit" => ledger.credit(event.amount())?,
            "withdrawal" => ledger.debit(event.amount())?,
            "transfer" => {
                ledger.debit(event.amount())?;
                ledger.note_transfer(event.counterparty())?;
            }
            other => {
                eprintln!("skipping unknown event kind {other}");
            }
        }
    }
    ledger.verify_against(&journal)?;
    ledger.finish()?;
    println!("wrote {}", ledger.path().display());
    Ok(())
}

fn _unused_helper(tenant: &Tenant) -> String {
    format!("tenant-{}", tenant.id())
}
```
'''
example_good = '''
The tenant query must carry tenant_id or Core returns an empty 200:

```rust
use foo::{Journal, Tenant};

fn main() -> Result<(), foo::Error> {
    let journal = Journal::open("journal")?;
    let tenant = Tenant::new("acme");
    let events = journal.events_for(&tenant)?;
    for event in events {
        println!("{:?}", event?);
    }
    Ok(())
}
```
'''

